services:
  neo4j:
    image: neo4j:5-community
    container_name: organ-network-neo4j
    restart: unless-stopped
    ports:
      # Restrict bindings to 127.0.0.1 (localhost) to avoid exposing the database to local network / public internet
      - "127.0.0.1:7474:7474" # Neo4j Browser & HTTP API
      - "127.0.0.1:7687:7687" # Bolt Protocol Port
    environment:
      # Initial password loaded securely from environment (.env)
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD environment variable must be set}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
